<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                新对话
            </button>
        </div>
        <div class="chat-history" id="chatHistory">
            <!-- 对话历史列表 -->
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar">U</div>
                <span>用户</span>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶部栏 -->
        <header class="top-bar">
            <button class="toggle-sidebar-btn" id="toggleSidebarBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="model-selector">
                <span class="model-badge" id="modelBadge">加载中...</span>
            </div>
        </header>

        <!-- 聊天区域 -->
        <div class="chat-container" id="chatContainer">
            <!-- 欢迎页面 -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-logo">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h1>有什么可以帮助你的？</h1>
                <div class="suggestion-cards">
                    <div class="suggestion-card" data-prompt="请用Python写一个快速排序算法">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                        <span>编写代码</span>
                        <p>请用Python写一个快速排序算法</p>
                    </div>
                    <div class="suggestion-card" data-prompt="解释一下什么是机器学习">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        <span>知识问答</span>
                        <p>解释一下什么是机器学习</p>
                    </div>
                    <div class="suggestion-card" data-prompt="帮我写一份工作周报模板">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                        <span>文档写作</span>
                        <p>帮我写一份工作周报模板</p>
                    </div>
                    <div class="suggestion-card" data-prompt="用三句话概括《三体》的主要内容">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <span>内容总结</span>
                        <p>用三句话概括《三体》的主要内容</p>
                    </div>
                </div>
            </div>

            <!-- 消息列表 -->
            <div class="messages-list" id="messagesList"></div>

            <!-- 思考中动画 -->
            <div class="thinking-indicator" id="thinkingIndicator" style="display: none;">
                <div class="thinking-dots">
                    <span></span><span></span><span></span>
                </div>
                <span id="thinkingText">AI 正在思考...</span>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <div class="input-container">
                <textarea 
                    id="messageInput" 
                    placeholder="输入消息，Enter 发送，Shift+Enter 换行"
                    rows="1"
                ></textarea>
                <div class="input-actions">
                    <!-- 联网搜索开关 -->
                    <button class="search-toggle-btn" id="searchToggleBtn" title="联网搜索">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <button class="send-btn" id="sendBtn" title="发送消息">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="input-disclaimer">AI 生成的内容仅供参考，请注意甄别</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
